name: Wildfire Tracker Automation

on:
  schedule:
    # Runs every 3 hours (Cron syntax)
    - cron: '0 */3 * * *'
  # Allows you to trigger it manually from the GitHub website too
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run script
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python tracker.py
